<script>
        const WORKER_URL = "https://nokhbe.m46680279.workers.dev";
        const STORAGE_KEY = "kodbaz.project.state.v2";
        const MAX_HISTORY = 50;
        const AUTOSAVE_DELAY = 300;

        let linesData = [];
        let assets = {};
        let projectMeta = defaultProjectMeta();
        let undoStack = [];
        let redoStack = [];
        let autosaveTimer = null;
        let pendingAssetName = null;

        function generateId() {
            return 'line_' + Math.random().toString(36).substr(2, 9);
        }

        function clone(data) {
            return JSON.parse(JSON.stringify(data));
        }

        function defaultProjectMeta() {
            return {
                themeName: 'dark',
                fontSize: 15,
                fontFamily: "'Courier New', Courier, monospace"
            };
        }

        function defaultLine() {
            return { id: generateId(), text: '', html: '', mode: 'text' };
        }

        function buildDefaultTemplateLines() {
            return [defaultLine()];
        }

        function isLegacyEmptyTemplateLines(rawLines) {
            if (!Array.isArray(rawLines) || rawLines.length !== 11) return false;
            const expected = [
                '<!DOCTYPE html>',
                '<html lang="fa" dir="rtl">',
                '<head>',
                '  <meta charset="UTF-8">',
                '  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">',
                '  <title>کدباز</title>',
                '</head>',
                '<body>',
                '',
                '</body>',
                '</html>'
            ];
            return rawLines.every((line, index) => {
                const html = line && typeof line.html === 'string' ? line.html.trimEnd() : '';
                const mode = line && typeof line.mode === 'string' ? line.mode : '';
                return mode === 'code' && html === expected[index];
            });
        }

        function sanitizeAssetName(name) {
            return (name || '')
                .trim()
                .replace(/\.[^.]+$/, '')
                .replace(/[^\w\u0600-\u06FF-]+/g, '_')
                .replace(/^_+|_+$/g, '') || '';
        }

        function normalizeThemeName(themeName) {
            const allowed = ['dark', 'light', 'dark-green', 'blue', 'red'];
            return allowed.includes(themeName) ? themeName : 'dark';
        }

        function normalizeFontFamily(fontFamily) {
            if (typeof fontFamily !== 'string' || !fontFamily.trim()) {
                return defaultProjectMeta().fontFamily;
            }
            return fontFamily;
        }

        function normalizeFontSize(fontSize) {
            const parsed = parseInt(fontSize, 10);
            if (Number.isFinite(parsed) && parsed >= 12 && parsed <= 24) {
                return parsed;
            }
            return 15;
        }

        function normalizeProjectState(raw) {
            const safe = raw && typeof raw === 'object' ? raw : {};
            let rawLines = [];
            if (Array.isArray(safe.linesData)) rawLines = safe.linesData;
            else if (Array.isArray(safe.lines)) rawLines = safe.lines;
            else if (Array.isArray(safe.project?.linesData)) rawLines = safe.project.linesData;

            let normalizedLines = rawLines.map((line) => {
                const isObject = line && typeof line === 'object';
                return {
                    id: isObject && typeof line.id === 'string' ? line.id : generateId(),
                    text: isObject && typeof line.text === 'string' ? line.text : '',
                    html: isObject && typeof line.html === 'string' ? line.html : '',
                    mode: isObject && line.mode === 'code' ? 'code' : 'text'
                };
            });

            if (!normalizedLines.length || isLegacyEmptyTemplateLines(rawLines)) normalizedLines = [defaultLine()];

            const normalizedAssets = {};
            const rawAssets = safe.assets && typeof safe.assets === 'object' ? safe.assets : {};
            Object.keys(rawAssets).forEach((key) => {
                const safeName = sanitizeAssetName(key);
                if (!safeName) return;
                const asset = rawAssets[key] || {};
                const data = typeof asset.data === 'string' ? asset.data : '';
                if (!data) return;
                normalizedAssets[safeName] = {
                    type: typeof asset.type === 'string' ? asset.type : 'image/*',
                    data,
                    filename: typeof asset.filename === 'string' ? asset.filename : safeName,
                    updatedAt: typeof asset.updatedAt === 'number' ? asset.updatedAt : Date.now()
                };
            });

            const metaSource = safe.projectMeta && typeof safe.projectMeta === 'object' ? safe.projectMeta : safe;
            const normalizedMeta = {
                ...defaultProjectMeta(),
                themeName: normalizeThemeName(metaSource.themeName || metaSource.theme || 'dark'),
                fontSize: normalizeFontSize(metaSource.fontSize),
                fontFamily: normalizeFontFamily(metaSource.fontFamily)
            };

            return { linesData: normalizedLines, assets: normalizedAssets, projectMeta: normalizedMeta };
        }

        function getStateSnapshot() {
            return {
                version: 2,
                linesData: clone(linesData),
                assets: clone(assets),
                projectMeta: clone(projectMeta)
            };
        }

        function encodeStateComment() {
            try {
                return `<!-- KODBAZ_STATE:${encodeURIComponent(JSON.stringify(getStateSnapshot()))} -->\n`;
            } catch (err) {
                console.warn('Could not encode project state.', err);
                return '';
            }
        }

        function decodeStateComment(html) {
            const match = html.match(/<!--\s*KODBAZ_STATE:([\s\S]*?)\s*-->/i);
            if (!match) return null;
            try {
                return JSON.parse(decodeURIComponent(match[1].trim()));
            } catch (err) {
                console.warn('Could not decode embedded project state.', err);
                return null;
            }
        }

        function persistProject() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(getStateSnapshot()));
            } catch (err) {
                console.warn('Autosave failed.', err);
            }
        }

        function scheduleAutosave() {
            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(persistProject, AUTOSAVE_DELAY);
        }

        function hasSavedProject() {
            try {
                return !!localStorage.getItem(STORAGE_KEY);
            } catch (err) {
                return false;
            }
        }

        function applyTheme(themeName) {
            document.body.className = '';
            const normalized = normalizeThemeName(themeName);
            if (normalized !== 'dark') {
                document.body.classList.add(normalized + '-theme');
            }
            const themeSelect = document.getElementById('theme-select');
            if (themeSelect) themeSelect.value = normalized;
            projectMeta.themeName = normalized;
            scheduleAutosave();
        }

        function applyFontSize(size, save = true) {
            const next = normalizeFontSize(size);
            document.documentElement.style.setProperty('--font-size', next + 'px');
            const range = document.getElementById('font-size');
            if (range) range.value = String(next);
            projectMeta.fontSize = next;
            if (save) scheduleAutosave();
        }

        function applyFontFamily(font, save = true) {
            const next = normalizeFontFamily(font);
            document.documentElement.style.setProperty('--font-family', next);
            const select = document.getElementById('font-family-select');
            if (select) select.value = next;
            projectMeta.fontFamily = next;
            if (save) scheduleAutosave();
        }

        function applyProjectMeta(meta) {
            const safe = meta && typeof meta === 'object' ? meta : defaultProjectMeta();
            projectMeta = {
                ...defaultProjectMeta(),
                themeName: normalizeThemeName(safe.themeName),
                fontSize: normalizeFontSize(safe.fontSize),
                fontFamily: normalizeFontFamily(safe.fontFamily)
            };
            applyTheme(projectMeta.themeName);
            applyFontSize(projectMeta.fontSize, false);
            applyFontFamily(projectMeta.fontFamily, false);
        }

        function restoreProjectState(rawState) {
            const normalized = normalizeProjectState(rawState);
            linesData = normalized.linesData;
            assets = normalized.assets;
            applyProjectMeta(normalized.projectMeta);
            undoStack = [];
            redoStack = [];
            renderEditor();
            renderAssetManager();
            persistProject();
        }

        function loadPersistedProject() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return false;
                const parsed = JSON.parse(raw);
                restoreProjectState(parsed);
                return true;
            } catch (err) {
                console.warn('Could not load saved project.', err);
                return false;
            }
        }

        function saveState() {
            undoStack.push(clone(linesData));
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
            redoStack = [];
            scheduleAutosave();
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(clone(linesData));
            linesData = undoStack.pop();
            renderEditor();
            scheduleAutosave();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(clone(linesData));
            linesData = redoStack.pop();
            renderEditor();
            scheduleAutosave();
        }

        function updateStatus(text) {
            const ind = document.getElementById('status-indicator');
            if (!ind) return;
            ind.innerHTML = `<div class="status-dot"></div> ${text}`;
            if (text === 'آنلاین') {
                ind.style.color = '#10b981';
                ind.style.borderColor = 'rgba(16, 185, 129, 0.3)';
            } else if (text === 'خطا') {
                ind.style.color = '#ef4444';
                ind.style.borderColor = 'rgba(239, 68, 68, 0.3)';
            } else {
                ind.style.color = '#f59e0b';
                ind.style.borderColor = 'rgba(245, 158, 11, 0.3)';
            }
        }

        function checkConnection() {
            const splash = document.getElementById('splash');
            const app = document.getElementById('app');
            if (navigator.onLine || hasSavedProject()) {
                splash.style.display = 'none';
                app.style.display = 'flex';
                if (linesData.length === 0) newProject(true);
                updateStatus(navigator.onLine ? 'آنلاین' : 'ذخیره شد');
            } else {
                splash.style.display = 'flex';
                app.style.display = 'none';
                const retryBtn = document.getElementById('retry-btn');
                if (retryBtn) retryBtn.style.display = 'block';
            }
        }

        window.addEventListener('online', checkConnection);
        window.addEventListener('offline', checkConnection);

        function escapeCommentText(text) {
            return String(text || '')
                .replace(/--/g, '- -')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .trim();
        }

        function resolveAssetsInText(text, resolveAssets = true) {
            if (!text) return '';
            return text.replace(/\{\{\s*([A-Za-z0-9_\-]+)\s*\}\}/g, (match, name) => {
                const asset = assets[name];
                if (resolveAssets && asset && typeof asset.data === 'string') {
                    return asset.data;
                }
                return match;
            });
        }

        function hasFullDocumentStructure() {
            return linesData.some((line) => {
                const html = typeof line.html === 'string' ? line.html.trim() : '';
                return /<!doctype\s+html|<html\b|<head\b|<body\b/i.test(html);
            });
        }

        function isHeadSnippet(html) {
            const value = String(html || '').trim().toLowerCase();
            if (!value) return false;
            if (/^<(?:!doctype|html|\/html|head|\/head|body|\/body)\b/.test(value)) return true;
            return /^(<meta\b|<title\b|<link\b|<style\b|<script\b|<base\b|<noscript\b)/.test(value);
        }

        function buildCompleteDocument(resolveAssets = false, includeState = false) {
            const rawPieces = [];
            const headPieces = [];
            const bodyPieces = [];

            linesData.forEach((line) => {
                const html = typeof line.html === 'string' ? line.html.trimEnd() : '';
                if (!html) return;

                const resolved = resolveAssetsInText(html, resolveAssets).trimEnd();
                rawPieces.push(resolved);

                if (!hasFullDocumentStructure()) {
                    if (isHeadSnippet(html)) headPieces.push(resolved);
                    else bodyPieces.push(resolved);
                }
            });

            const content = rawPieces.filter(Boolean).join('\n').trimEnd();

            if (!content) {
                return includeState ? encodeStateComment().trimEnd() : '';
            }

            if (hasFullDocumentStructure()) {
                return includeState ? `${encodeStateComment().trimEnd()}\n${content}` : content;
            }

            const headContent = headPieces.length ? `\n${headPieces.join('\n')}\n` : '\n';
            const bodyContent = bodyPieces.length ? `\n${bodyPieces.join('\n')}\n` : '\n';

            const documentHTML = `<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کدباز</title>${headContent}</head>
<body>${bodyContent}</body>
</html>`.trimEnd();

            return includeState ? `${encodeStateComment().trimEnd()}\n${documentHTML}` : documentHTML;
        }

        function buildVisibleDocument() {
            return buildCompleteDocument(false, false);
        }

        function buildExportDocument() {
            return buildCompleteDocument(true, true);
        }

        function newProject(silent = false) {
            if (!silent) saveState();
            linesData = [defaultLine()];
            assets = {};
            undoStack = [];
            redoStack = [];
            renderEditor(linesData[0].id);
            renderAssetManager();
            scheduleAutosave();
            closeAllMenus();
        }

        function renderAssetManager() {
            const list = document.getElementById('asset-list');
            if (!list) return;

            const names = Object.keys(assets).sort((a, b) => a.localeCompare(b, 'fa'));
            if (names.length === 0) {
                list.innerHTML = '<div style="font-size:13px; opacity:.75; line-height:1.7;">هنوز تصویری اضافه نشده است.</div>';
                return;
            }

            list.innerHTML = names.map((name) => {
                const asset = assets[name];
                const thumb = asset && asset.data ? asset.data : '';
                const sizeInfo = asset && asset.data ? `${Math.round((asset.data.length * 3) / 4 / 1024)} KB` : '';
                return `
                    <div style="display:flex; gap:8px; align-items:center; border:1px solid var(--border-color); border-radius:var(--border-radius); padding:8px;">
                        <img src="${thumb}" alt="${name}" style="width:40px; height:40px; object-fit:cover; border-radius:6px; flex-shrink:0; border:1px solid var(--border-color); background:var(--line-num-bg);">
                        <div style="display:flex; flex-direction:column; gap:2px; min-width:0; flex:1;">
                            <div style="font-size:13px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${name}</div>
                            <div style="font-size:11px; opacity:.7;">${asset.type || 'image'} ${sizeInfo}</div>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:6px;">
                            <button type="button" onclick="openAssetReplace('${name}')" style="padding:6px 8px; font-size:12px;">جایگزینی</button>
                            <button type="button" onclick="deleteAsset('${name}')" style="padding:6px 8px; font-size:12px;">حذف</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function normalizeImportedAssetName(file) {
            const rawInput = document.getElementById('asset-name');
            const fromInput = rawInput ? rawInput.value : '';
            const fallback = file && file.name ? file.name.replace(/\.[^.]+$/, '') : 'asset';
            const base = sanitizeAssetName(fromInput || fallback || 'asset');
            return base || 'asset';
        }

        function openAssetReplace(name) {
            pendingAssetName = name;
            const input = document.getElementById('asset-import');
            if (input) {
                input.value = '';
                input.click();
            }
        }

        function openAssetImportByName(name) {
            pendingAssetName = name || null;
            const input = document.getElementById('asset-import');
            if (!input) return;
            input.value = '';
            input.click();
        }

        function importAssetViaFileInput(event) {
            const file = event && event.target && event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (loadEvent) => {
                const dataUrl = loadEvent.target.result;
                const name = sanitizeAssetName(pendingAssetName || normalizeImportedAssetName(file));
                if (!name) {
                    alert('نام تصویر معتبر نیست.');
                    pendingAssetName = null;
                    return;
                }

                assets[name] = {
                    type: file.type || 'image/*',
                    data: dataUrl,
                    filename: file.name || name,
                    updatedAt: Date.now()
                };

                pendingAssetName = null;
                const assetNameInput = document.getElementById('asset-name');
                if (assetNameInput) assetNameInput.value = '';
                renderAssetManager();
                scheduleAutosave();
                closeAllMenus();
            };
            reader.readAsDataURL(file);
        }

        function importAsset(event) {
            return importAssetViaFileInput(event);
        }

        function deleteAsset(name) {
            if (!assets[name]) return;
            if (!confirm(`تصویر «${name}» حذف شود؟`)) return;
            saveState();
            delete assets[name];
            renderAssetManager();
            scheduleAutosave();
        }

        function buildAiPrompt(line) {
            const assetNames = Object.keys(assets).sort();
            const assetHint = assetNames.length
                ? assetNames.map((name) => `{{${name}}}`).join(', ')
                : 'هیچ تصویری در پروژه ثبت نشده است.';

            const domMap = linesData
                .map((l, i) => {
                    const prompt = (l.text || '').trim();
                    const code = (l.html || '').trim();
                    return `Line ${i + 1} [ID: ${l.id}] (${l.mode}): ${prompt ? `prompt="${prompt}"` : '(no prompt)'}${code ? ` | code="${code}"` : ''}`;
                })
                .join('\n');

            return `You are a strict code generator.
Context:
${domMap}

Available symbolic image placeholders:
${assetHint}

USER COMMAND (Persian): "${line.text}"

Rules:
1. Output ONLY pure code (HTML/CSS/JS) for this line.
2. NO markdown wrapping.
3. If you need images, use only symbolic placeholders like <img src="{{logo}}">.
4. Never use file paths, external links, or base64.
5. MUST include id="${line.id}" on the root element you generate.`;
        }

        async function triggerAI(lineId) {
            const lineIndex = linesData.findIndex((l) => l.id === lineId);
            if (lineIndex === -1) return;
            const line = linesData[lineIndex];

            updateStatus('درحال پردازش...');

            const prompt = buildAiPrompt(line);

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: prompt }]
                    })
                });

                if (!res.ok) throw new Error('API Error');
                const data = await res.json();

                if (data.choices && data.choices.length > 0) {
                    let html = data.choices[0].message.content || '';
                    html = html
                        .replace(/^```[a-z]*\n?/im, '')
                        .replace(/```$/im, '')
                        .trim()
                        .replace(/\r?\n+/g, ' ')
                        .replace(/\s{2,}/g, ' ')
                        .trim();

                    const updatedIndex = linesData.findIndex((l) => l.id === lineId);
                    if (updatedIndex !== -1) {
                        linesData[updatedIndex].html = html;
                        linesData[updatedIndex].mode = 'code';
                        renderEditor(lineId);
                        scheduleAutosave();
                    }
                }
            } catch (err) {
                console.error(err);
                updateStatus('خطا');
                alert('خطا در ارتباط با هوش مصنوعی.');
            } finally {
                if (document.getElementById('status-indicator').innerText.includes('درحال')) {
                    updateStatus(navigator.onLine ? 'آنلاین' : 'ذخیره شد');
                }
            }
        }

        function renderEditor(focusId = null) {
            const container = document.getElementById('editor');
            if (!container) return;
            const previousScrollTop = container.scrollTop;
            container.innerHTML = '';

            linesData.forEach((line, index) => {
                const row = document.createElement('div');
                row.className = 'editor-row';
                row.id = 'row-' + line.id;

                const lineNum = document.createElement('div');
                lineNum.className = 'line-num';
                lineNum.innerText = index + 1;

                const content = document.createElement('div');
                content.className = 'content';
                content.contentEditable = 'true';
                content.setAttribute('spellcheck', 'false');

                if (line.mode === 'code') {
                    content.setAttribute('dir', 'ltr');
                    content.textContent = line.html || '';
                } else {
                    content.setAttribute('dir', 'rtl');
                    content.textContent = line.text || '';
                }

                content.addEventListener('input', () => {
                    if (line.mode === 'code') {
                        line.html = content.textContent;
                    } else {
                        line.text = content.textContent;
                    }
                    scheduleAutosave();
                });

                content.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        saveState();

                        const newId = generateId();
                        const currentIndex = linesData.findIndex((l) => l.id === line.id);
                        linesData.splice(currentIndex + 1, 0, { id: newId, text: '', html: '', mode: 'text' });

                        if (line.mode === 'text' && line.text.trim() && !line.html) {
                            triggerAI(line.id);
                        }

                        renderEditor(newId);
                    }
                });

                const actions = document.createElement('div');
                actions.className = 'actions';

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'icon-btn';
                toggleBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>';
                toggleBtn.title = 'کد / متن';
                toggleBtn.onclick = () => {
                    saveState();
                    line.mode = line.mode === 'text' ? 'code' : 'text';
                    updateRowDOM(line.id);
                    scheduleAutosave();
                };

                actions.appendChild(toggleBtn);
                row.appendChild(lineNum);
                row.appendChild(content);
                row.appendChild(actions);
                container.appendChild(row);

                if (focusId === line.id) {
                    setTimeout(() => {
                        content.focus();
                        const range = document.createRange();
                        const sel = window.getSelection();
                        range.selectNodeContents(content);
                        range.collapse(false);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }, 0);
                }
            });

            requestAnimationFrame(() => {
                container.scrollTop = previousScrollTop;
            });
        }

        function updateRowDOM(lineId) {
            const row = document.getElementById('row-' + lineId);
            if (!row) return;
            const line = linesData.find((l) => l.id === lineId);
            if (!line) return;
            const content = row.querySelector('.content');
            if (!content) return;

            if (line.mode === 'code') {
                content.setAttribute('dir', 'ltr');
                content.textContent = line.html || '';
            } else {
                content.setAttribute('dir', 'rtl');
                content.textContent = line.text || '';
            }
        }

        function buildLegacyContentState(contentText) {
            const rawLines = contentText.split('\n');
            const parsedLines = [];
            let pendingPrompt = '';

            rawLines.forEach((raw) => {
                const line = raw.replace(/\r/g, '');
                if (!line.trim()) return;

                const promptMatch = line.match(/<!--\s*Prompt:\s*([\s\S]*?)\s*-->/i);
                if (promptMatch) {
                    pendingPrompt = promptMatch[1].trim();
                    return;
                }

                const cleaned = line.trim();
                if (pendingPrompt) {
                    parsedLines.push({
                        id: generateId(),
                        text: pendingPrompt,
                        html: cleaned,
                        mode: 'code'
                    });
                    pendingPrompt = '';
                } else {
                    parsedLines.push({
                        id: generateId(),
                        text: '',
                        html: cleaned,
                        mode: 'code'
                    });
                }
            });

            if (pendingPrompt) {
                parsedLines.push({
                    id: generateId(),
                    text: pendingPrompt,
                    html: '',
                    mode: 'text'
                });
            }

            return parsedLines.length ? parsedLines : buildDefaultTemplateLines();
        }

        function importProject(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const text = event.target.result || '';
                const embedded = decodeStateComment(text);

                saveState();

                if (embedded) {
                    restoreProjectState(embedded);
                } else {
                    const bodyMatch = text.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
                    const contentText = bodyMatch ? bodyMatch[1] : text;
                    linesData = buildLegacyContentState(contentText);
                    assets = {};
                    renderEditor();
                    renderAssetManager();
                    scheduleAutosave();
                }

                closeAllMenus();
            };
            reader.readAsText(file);
        }

        function gotoLine() {
            const num = parseInt(document.getElementById('goto-line').value, 10);
            if (num > 0 && num <= linesData.length) {
                const rowId = 'row-' + linesData[num - 1].id;
                const row = document.getElementById(rowId);
                if (row) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    row.querySelector('.content').focus();
                }
            }
            closeAllMenus();
        }

        function searchAndReplace() {
            const term = document.getElementById('search-term').value;
            const rep = document.getElementById('replace-term').value;
            if (!term) return;
            saveState();
            let replaced = false;
            linesData.forEach((line) => {
                if (line.mode === 'text' && line.text.includes(term)) {
                    line.text = line.text.split(term).join(rep);
                    replaced = true;
                } else if (line.mode === 'code' && line.html.includes(term)) {
                    line.html = line.html.split(term).join(rep);
                    replaced = true;
                }
            });
            if (replaced) {
                renderEditor();
                scheduleAutosave();
            }
            closeAllMenus();
        }

        function toggleMenu(id, event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById(id);
            if (!menu) return;
            const isVisible = menu.style.display === 'flex';
            closeAllMenus();
            if (!isVisible) menu.style.display = 'flex';
        }

        function closeAllMenus() {
            document.querySelectorAll('.menu-panel').forEach((m) => m.style.display = 'none');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-panel') && !e.target.closest('.icon-btn')) {
                closeAllMenus();
            }
        });

        function changeFontSize(size) {
            applyFontSize(size);
        }

        function changeFontFamily(font) {
            applyFontFamily(font);
        }

        function changeTheme(themeName) {
            applyTheme(themeName);
        }

        function runPreview() {
            const previewFrame = document.getElementById('preview-frame');
            previewFrame.srcdoc = buildExportDocument();
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function showFullCode() {
            const area = document.getElementById('full-code-area');
            area.value = buildVisibleDocument();
            document.getElementById('full-code-modal').style.display = 'flex';
        }

        function copyFullCode() {
            const area = document.getElementById('full-code-area');
            area.select();
            document.execCommand('copy');
            alert('سورس کد کپی شد.');
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        async function saveProject() {
            const fullHTML = buildExportDocument();
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'project.html',
                        types: [{ description: 'HTML File', accept: { 'text/html': ['.html'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(fullHTML);
                    await writable.close();
                } catch (e) {
                    if (e.name !== 'AbortError') fallbackDownload(fullHTML);
                }
            } else {
                fallbackDownload(fullHTML);
            }
            closeAllMenus();
        }

        function fallbackDownload(content) {
            const blob = new Blob([content], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'project.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        function installEditorScrollFixes() {
            const editor = document.getElementById('editor');
            if (!editor) return;

            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartScrollTop = 0;
            let touchStartTargetIsCode = false;

            editor.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    touchStartScrollTop = editor.scrollTop;
                    touchStartTargetIsCode = !!e.target.closest('.content[dir="ltr"]');
                }
            }, { passive: true });

            editor.addEventListener('touchmove', (e) => {
                if (e.touches && e.touches.length === 1) {
                    const dx = e.touches[0].clientX - touchStartX;
                    const dy = e.touches[0].clientY - touchStartY;

                    // روی خط‌های کد، حرکت افقی را آزاد بگذار تا خودِ همان خط اسکرول شود.
                    if (touchStartTargetIsCode && Math.abs(dx) >= Math.abs(dy)) {
                        return;
                    }

                    // برای بقیه بخش‌ها، اسکرول عمودی ادیتور حفظ شود.
                    if (Math.abs(dy) >= Math.abs(dx)) {
                        editor.scrollTop = touchStartScrollTop - dy;
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            editor.addEventListener('wheel', (e) => {
                if (Math.abs(e.deltaY) > 0) {
                    editor.scrollTop += e.deltaY;
                    e.preventDefault();
                }
            }, { passive: false });
        }

        function openImageManager() {
            toggleMenu('plus-menu');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const loaded = loadPersistedProject();
            if (!loaded && linesData.length === 0) {
                linesData = buildDefaultTemplateLines();
                applyProjectMeta(defaultProjectMeta());
            }
            renderEditor();
            renderAssetManager();
            checkConnection();
            installEditorScrollFixes();

            const fileInput = document.getElementById('asset-import');
            if (fileInput) {
                fileInput.onchange = importAssetViaFileInput;
            }

        });
    </script>
